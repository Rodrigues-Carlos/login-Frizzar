<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frizzar — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Tokens — troque as imagens aqui, tudo puxa dessas variáveis
   ============================================================ */
:root{
  --ink:#0c0c0c;
  --paper:#ffffff;
  --red:#e0473f;
  --blue:#2563eb;
  --gold:#d7aa62;
  --muted:rgba(255,255,255,.66);
  --hairline:rgba(255,255,255,.1);
  --promo-image:url('imagens/fundo.png');
  --banner-image:url('imagens/ChatGPT%20Image%2027%20de%20ago.%20de%202026,%2014_05_42.png');
  --radius-lg:20px;
  --radius-md:14px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,'Segoe UI',Roboto,Arial,sans-serif;min-height:100vh;overflow-x:hidden;background:var(--paper)}
.login-screen{display:flex;min-height:100vh;width:100%}

/* ============================================================
   Painel promocional (esquerda)
   ============================================================ */
.promo-side{
  position:relative;flex:1 1 58%;min-width:0;
  padding:60px 64px 48px;
  background:var(--ink) var(--promo-image) center/cover no-repeat;
  color:#fff;overflow:hidden;
}
.promo-side::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,rgba(6,4,5,.94),rgba(10,6,8,.86) 45%,rgba(10,6,8,.72));
}
.promo-inner{position:relative;z-index:1;display:flex;flex-direction:column;max-width:760px}

.eyebrow{display:flex;align-items:center;gap:9px;margin-bottom:16px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.eyebrow::before{content:'';width:26px;height:2px;background:var(--red)}
.eyebrow-star{margin-left:1px;color:var(--red)}

.promo-title{font-size:clamp(32px,3.6vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1.05}
.promo-title span{color:var(--red)}
.promo-lead{margin-top:16px;max-width:440px;color:var(--muted);font-size:14.5px;line-height:1.6}

/* ============================================================
   Grade de recursos — imagem à esquerda, nome à direita,
   texto embaixo alinhado à esquerda
   ============================================================ */
.feature-grid{
  display:flex;
  flex-direction:column;
  gap:22px;
  margin-top:58px;
}
.feature-card{
  display:flex;
  align-items:center;
  gap:14px;
  transition:transform .2s ease;
}
.feature-card:nth-child(even){flex-direction:row-reverse;text-align:right}
.feature-card:hover{transform:translateX(4px)}
.feature-card:nth-child(even):hover{transform:translateX(-4px)}
.feature-thumb{
  flex:0 0 190px;width:190px;height:190px;border-radius:16px;
  object-fit:cover;background:#151515;border:1px solid rgba(255,255,255,.08);
}
.feature-thumb.first-feature-thumb{
  height:auto;
  aspect-ratio:648 / 429;
  object-fit:contain;
}
.feature-thumb.wide{
  flex-basis:320px;width:320px;height:121px;
  border:none;background:transparent;object-fit:cover;
}
.feature-name{font-size:22px;font-weight:700;letter-spacing:-.015em;line-height:1.25}

/* ============================================================
   Banner inferior (equipe / apresentação da marca)
   ============================================================ */
.promo-banner{
  position:relative;margin-top:30px;min-height:150px;
  border-radius:var(--radius-lg);overflow:hidden;
  border:1px solid rgba(215,170,98,.3);
  background:#151009 var(--banner-image) center/cover no-repeat;
  box-shadow:0 24px 55px rgba(0,0,0,.4);
  display:flex;align-items:center;
}
@media(min-width:901px){
  .promo-side{padding-bottom:240px}
  .promo-banner{
    position:fixed;z-index:5;
    left:64px;right:484px;bottom:40px;
    margin-top:0;
  }
}
@media(min-width:901px) and (max-width:1200px){
  .promo-banner{left:40px;right:460px;bottom:30px}
}
.promo-banner::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(4,3,3,.95) 0%,rgba(8,5,4,.82) 42%,rgba(10,6,3,.25) 100%);
}
.banner-copy{position:relative;z-index:1;max-width:50%;padding:22px 20px 22px 26px;border-left:3px solid var(--red)}
.banner-message{color:#fff;font-weight:700;font-size:clamp(13px,1.5vw,18px);line-height:1.28;letter-spacing:-.02em}
.banner-people{
  position:absolute;z-index:1;right:0;bottom:0;
  width:min(40%,320px);height:100%;object-fit:contain;object-position:bottom;
  pointer-events:none;
}

/* ============================================================
   Painel de login (direita)
   ============================================================ */
.login-side{
  flex:0 0 420px;max-width:420px;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:60px 40px 40px;
}
.login-logo{font-size:26px;font-weight:700;letter-spacing:.05em;color:#111;margin-bottom:40px;display:flex;align-items:baseline;gap:2px}
.login-logo .dot{color:var(--red);font-size:26px;line-height:0}
.login-form{width:100%;max-width:320px}
.login-form input{
  width:100%;padding:14px 16px;margin-bottom:14px;
  border:1px solid #dcdcdc;border-radius:8px;font-size:14px;color:#222;
  outline:none;transition:border-color .15s ease,box-shadow .15s ease;
}
.login-form input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(224,71,63,.12)}
.login-form button{
  width:100%;padding:14px;margin-top:6px;margin-bottom:18px;
  background:var(--blue);color:#fff;border:none;border-radius:8px;
  font-size:15px;font-weight:700;cursor:pointer;transition:background .15s ease;
}
.login-form button:hover{background:#1d4ed8}
.login-form a{display:block;text-align:left;font-size:13px;color:#6b6b6b;text-decoration:none}
.login-form a:hover{color:var(--red);text-decoration:underline}

/* ============================================================
   Responsivo
   ============================================================ */
@media(max-width:1080px){
  .promo-side{padding:48px 40px 36px}
}
@media(max-width:900px){
  .login-screen{flex-direction:column}
  .promo-side{order:1;padding:44px 24px 32px}
  .login-side{order:2;flex:none;max-width:100%;padding:44px 24px}
  .banner-people{width:min(46%,240px)}
}
@media(max-width:520px){
  .promo-title{font-size:30px}
  .banner-copy{max-width:56%;padding:16px}
  .banner-message{font-size:11px}
  .banner-people{width:38%}
  .feature-thumb{flex:0 0 120px;width:120px;height:120px}
  .feature-thumb.wide{flex-basis:200px;width:200px;height:76px}
  .feature-name{font-size:17px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important}
}
</style>
</head>
<body>
<div class="login-screen">

  <section class="promo-side" aria-label="Nova experiência Frizzar">
    <div class="promo-inner">

      <div class="promo-copy">
        <p class="eyebrow">Lançamento<span class="eyebrow-star">*</span></p>
        <h1 class="promo-title">Novidades chegando<br>no seu site <span>Frizzar.</span></h1>
      </div>

      <div class="feature-grid" aria-label="Recursos da nova área de clientes">
        <article class="feature-card">
          <img class="feature-thumb first-feature-thumb" src="imagens/box%20de%20cores.png" alt="Prévia de personalização de cores">
          <h2 class="feature-name">Personalize do seu jeito</h2>
        </article>

        <article class="feature-card">
          <img class="feature-thumb" src="imagens/promo%C3%A7%C3%A3o.png" alt="Campanha de desconto para corte">
          <h2 class="feature-name">Campanhas de venda</h2>
        </article>

        <article class="feature-card">
          <img class="feature-thumb wide" src="imagens/spotify.png" alt="Prévia de playlist para barbearia">
          <h2 class="feature-name">O que vocês escutam</h2>
        </article>

        <article class="feature-card">
          <img class="feature-thumb wide" src="imagens/story.png" alt="Story clicável com categorias">
          <h2 class="feature-name">Story clicável</h2>
        </article>

        <article class="feature-card">
          <img class="feature-thumb" src="imagens/plano.png" alt="Plano de assinatura para barbearia">
          <h2 class="feature-name">Plano de assinatura</h2>
        </article>
      </div>

      <section class="promo-banner" aria-label="Frizzar para barbearias e salões">
        <div class="banner-copy">
          <p class="banner-message">Mais autonomia para personalizar a presença digital e apresentar sua marca de forma profissional.</p>
        </div>
        <img class="banner-people" src="imagens/barbeiro.png" alt="Profissionais de barbearia e salão">
      </section>

    </div>
  </section>

  <section class="login-side" aria-label="Entrar na sua conta">
    <div class="login-logo">FRIZZAR<span class="dot">.</span></div>
    <form class="login-form" onsubmit="return false;">
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Senha" required>
      <button type="submit">Entrar</button>
      <a href="#">Esqueceu sua senha?</a>
    </form>
  </section>

</div>
</body>
</html>
